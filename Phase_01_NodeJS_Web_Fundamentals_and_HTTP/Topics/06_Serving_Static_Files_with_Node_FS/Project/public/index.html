<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node.js Native Static File Server</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="box">
    <h1>🚀 Static Assets Delivered!</h1>
    <p>This HTML, along with <code>style.css</code> and <code>app.js</code>, was streamed directly from disk using Node's <code>fs.createReadStream().pipe(res)</code>.</p>
    <div id="status-card" class="card">
      <span class="badge">Live Status</span>
      <p id="msg">Inspecting client-side JavaScript execution...</p>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
